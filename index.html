<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>RPTV Cast Receiver</title>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    cast-media-player {
      width: 100%;
      height: 100%;
      --background-color: #000;
    }
  </style>
</head>

<body>

  <cast-media-player></cast-media-player>

  <script>
    const TAG = "[RPTV_RECEIVER]";

    console.log(TAG + " SCRIPT_LOADED");

    window.addEventListener("error", function(event) {
      console.error(
        TAG + " WINDOW_ERROR",
        event.message,
        event.filename,
        event.lineno,
        event.colno
      );
    });

    window.addEventListener("unhandledrejection", function(event) {
      console.error(
        TAG + " UNHANDLED_REJECTION",
        event.reason
      );
    });

    try {
      console.log(TAG + " GET_CONTEXT");

      const context =
        cast.framework.CastReceiverContext.getInstance();

      console.log(TAG + " GET_PLAYER_MANAGER");

      const playerManager =
        context.getPlayerManager();

      console.log(TAG + " INSTALL_LOAD_INTERCEPTOR");

      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.LOAD,
        function(request) {

          console.log(
            TAG + " LOAD_REQUEST",
            JSON.stringify({
              autoplay: request.autoplay,
              currentTime: request.currentTime,
              contentId:
                request.media
                  ? request.media.contentId
                  : null,
              contentUrl:
                request.media
                  ? request.media.contentUrl
                  : null,
              contentType:
                request.media
                  ? request.media.contentType
                  : null,
              streamType:
                request.media
                  ? request.media.streamType
                  : null
            })
          );

          return request;
        }
      );

      console.log(TAG + " RECEIVER_STARTING");

      const options =
        new cast.framework.CastReceiverOptions();

      options.disableIdleTimeout = false;

      context.start(options);

      console.log(TAG + " RECEIVER_STARTED");

    } catch (e) {

      console.error(
        TAG + " STARTUP_EXCEPTION",
        e && e.stack ? e.stack : String(e)
      );
    }
  </script>

</body>
</html>
